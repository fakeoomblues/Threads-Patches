name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          stable: true

      - name: Install lint tools
        run: brew install pre-commit actionlint ruff

      - run: pre-commit run --all-files --show-diff-on-failure
      - run: python3 -m unittest discover -s scripts/tests -v

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          stable: true

      - name: Install build tools
        run: |
          brew install openjdk@21
          brew install --cask android-cli
          echo "$(brew --prefix openjdk@21)/bin" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$HOME/Android/Sdk" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Android/Sdk/platform-tools
            ~/Android/Sdk/build-tools
          key: ${{ runner.os }}-android-sdk-platform-tools-build-tools-${{ hashFiles('settings.gradle.kts', 'gradle/libs.versions.toml') }}

      - name: Install Android platform tools
        run: android --sdk="$ANDROID_HOME" sdk install platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Gradle verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew verify --no-daemon

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: patches-${{ github.sha }}-${{ github.run_attempt }}
          path: patches/build/libs/patches-*.mpp
          if-no-files-found: error
          retention-days: 7
